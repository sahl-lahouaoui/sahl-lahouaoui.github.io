<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="images/sahl studio logo favicon.webp" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Sora:wght@100..800&display=swap"
        />
        <meta name="color-scheme" content="light" />
        <title>404 — Page Not Found</title>

        <style>
            html,
            body {
                margin: 0;
                min-height: 100vh;
                overflow: hidden;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            .error {
                padding: 40px;
            }

            .error img {
                width: 260px;
            }

            h1 {
                font-size: 160px;
                margin: 0;
                color: var(--red);
                line-height: 1;
            }

            h2 {
                font-size: 24px;
                font-weight: 700;
                color: var(--red);
                margin: 10px 0 0;
            }
            .p404 {
                font-size: 15px;
                color: #adadad;
                margin: 10px;
            }

            a {
                display: inline-block;
                margin-top: 25px;
                text-decoration: none;
                background-color: var(--red);
                padding: 30px 90px;
                border-radius: 90px;
                color: var(--white);
                font-size: 20px;
                transition:
                    transform 0.15s ease,
                    box-shadow 0.15s ease,
                    filter 0.15s ease;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            }

            a:hover {
                filter: brightness(1.1);
            }

            a:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
                filter: brightness(0.95);
            }

            .error > * {
                opacity: 0;
                transform: translateY(40px);
                animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            .error > *:nth-child(1) {
                animation-delay: 0.1s;
            }

            .error > *:nth-child(2) {
                animation-delay: 0.2s;
            }

            .error > *:nth-child(3) {
                animation-delay: 0.3s;
            }

            .error > *:nth-child(4) {
                animation-delay: 0.4s;
            }

            .error > *:nth-child(5) {
                animation-delay: 0.5s;
            }

            @keyframes reveal {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            /* ===== phone ===== */
            @media (max-width: 768px) {
                .error {
                    padding: 25px;
                }

                .error img {
                    width: 200px;
                }

                h1 {
                    font-size: 120px;
                }

                h2 {
                    font-size: 20px;
                }
                .p404 {
                    font-size: 13px;
                }
                a {
                    padding: 25px 50px;
                }
            }
        </style>
    </head>

    <body>
        <site-theme></site-theme>
        <protected-img></protected-img>
        <main class="error">
            <h1>404</h1>
            <img src="images/error img.gif" class="protected" />
            <h2>Sorry, we can't find this page.</h2>
            <p class="p404">404 page not found. It seems you got a little bit lost.</p>
            <a href="index.html"><pre>GO TO HOMEPAGE ➜</pre></a>
        </main>

        <script type="module" src="components/Theme.js"></script>
        <script type="module" src="components/ProtectedImg.js"></script>
    </body>
</html>

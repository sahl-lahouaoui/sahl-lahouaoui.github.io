<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Portfolio of Sahl Lahouaoui" />
        <meta name="author" content="Sahl Lahouaoui" />
        <meta name="theme-color" content="var(--black)" />
        <link rel="icon" href="images/sahl studio logo favicon.webp" />
        <meta property="og:title" content="Sahl Portfolio" />
        <meta property="og:image" content="images/preview.jpg" />
        <meta property="og:type" content="website" />
        <link rel="stylesheet" href="styles/contact-style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Sora:wght@100..800&display=swap"
/>
        
        <title>contact - Sahl</title>
    </head>
    <body>
        <site-theme></site-theme>
        <site-header></site-header>

        <h1 class="contact-title">Get in touch with me.</h1>

<section class="template">
    <form id="contact-form">

        <div class="name">
            <h2>Hi, I’m</h2>
            <input
                type="text"
                name="name"
                placeholder="What's your name?"
                required
            />
        </div>

        <div class="email">
            <h2>Where can I reach you?</h2>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="What's your email address?"
                required
            />
        </div>

        <div class="reason">
            <h2>What brings you here?</h2>
            <input
                type="text"
                name="reason"
                placeholder="What's this about?"
                required
            />
        </div>

        <div class="message">
            <h1>And let’s talk.</h1>
            <h2>What would you like to share?</h2>

            <textarea
                name="message"
                placeholder="Tell me a little more..."
                required
            ></textarea>
        </div>

        
        <label class="privacy-consent">
            <input
                type="checkbox"
                name="privacy_consent"
                value="I agree"
                required
            />
            <span>
                I agree to share my information so you can reply to me.
            </span>
        </label>

        <button type="submit" class="submit-button">
            <span data-i18n="send_message">send message</span>

            <span class="arrow">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path
                        d="M3.125 10H16.875"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M11.25 4.375L16.875 10L11.25 15.625"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </span>
        </button>

        <input
    type="text"
    name="website"
    class="honeypot"
    tabindex="-1"
    autocomplete="off"
    aria-hidden="true"
/>
    </form>
</section>

        <site-footer></site-footer>
        <script type="module" src="components/SiteFooter.js"></script>
        <script type="module" src="components/SiteHeader.js"></script>
        <script type="module" src="components/Theme.js"></script>
        
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script src="scripts/contact.js"></script>
        
        <script>
        const email = document.getElementById("email");

email.addEventListener("blur", () => {
    if (email.value === "") {
        email.classList.remove("error", "success");
    } else if (email.validity.valid) {
        email.classList.remove("error");
        email.classList.add("success");
    } else {
        email.classList.remove("success");
        email.classList.add("error");
    }
});
        
        const requiredFields = form.querySelectorAll("[required]");

requiredFields.forEach((field) => {
    field.addEventListener("invalid", () => {
        field.parentElement.classList.add("required-error");
    });

    field.addEventListener("input", () => {
        if (field.value.trim() !== "") {
            field.parentElement.classList.remove("required-error");
        }
    });
});
        
        </script>
    </body>
</html>

        <h1 class="contact-title">Get in touch with<span> me.</span></h1>

        <section class="template">
            <form id="contact-form">
                <div class="name">
    <label for="name">Hi, I’m</label>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="your name"
        autocomplete="name"
        required
    />
</div>

               <div class="email">
    <label for="email">Where can I reach you?</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="your.email@gmail.com"
        autocomplete="email"
        required
    />
</div>

                <div class="reason">
    <label for="reason">What brings you here?</label>
    <input
        type="text"
        id="reason"
        name="reason"
        placeholder="What's this about?"
        required
    />
</div>

                <div class="message">
    <h1>And let’s talk.</h1>

    <label for="message">What would you like to share?</label>

    <textarea
        id="message"
        name="message"
        placeholder="Tell me a little more..."
        required
    ></textarea>
</div>

                <label class="privacy-consent">
                    <input type="checkbox" name="privacy_consent" value="I agree" required />
                    <span> I agree to share my information so you can reply to me. </span>
                </label>

                <button type="submit" class="submit-button">
                    <span data-i18n="send_message">send message</span>

                    <span class="arrow">
                        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">

                            <path

                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                    </span>
                </button>
                
                <p class="p-submit">I’ll get back to you as soon as I can. Thanks for your patience ;)</p>
                
                <div class="form-status" aria-live="polite"></div>
                <input
                    type="text"
                    name="website"
                    class="honeypot"
                    id="honeypot"
                    tabindex="-1"
                    autocomplete="off"
                    aria-hidden="true"

        <script src="scripts/contact.js"></script>

        <script>
            const email = document.getElementById('email');

            email.addEventListener('blur', () => {
                if (email.value === '') {
                    email.classList.remove('error', 'success');
                } else if (email.validity.valid) {
                    email.classList.remove('error');
                    email.classList.add('success');
                } else {
                    email.classList.remove('success');
                    email.classList.add('error');
                }
            });

            const requiredFields = form.querySelectorAll('[required]');

            requiredFields.forEach((field) => {
                field.addEventListener('invalid', () => {
                    field.parentElement.classList.add('required-error');
                });

                field.addEventListener('input', () => {
                    if (field.value.trim() !== '') {
                        field.parentElement.classList.remove('required-error');
                    }
                });
            });
        </script>
